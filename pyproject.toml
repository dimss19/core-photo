[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "core-photo"
version = "1.0.0"
description = "Aplikasi Desktop Pengambilan Foto Core Terstruktur"
readme = "PRD_Core_Photo_AI_Agent.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "CorePhoto Team" }
]
dependencies = [
    "customtkinter>=5.2.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "rawpy>=0.19.0",
    "piexif>=1.1.3",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
